<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dev Portfolio</title>
  <style>
    :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #666666; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111111; --fg: #f2f2f2; --muted: #9a9a9a; --accent: #60a5fa; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 40rem; margin: 0 auto; padding: 4rem 1rem; }
    h1 { margin: 0 0 .25rem; font-size: 2rem; }
    p.lead { margin: 0 0 2rem; color: var(--muted); }
    h2 { margin: 2rem 0 .5rem; font-size: 1.1rem; }
    a { color: var(--accent); }
    code { font-family: ui-monospace, Menlo, Consolas, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>Your Name</h1>
    <p class="lead">Developer. Replace this text with a one-line intro.</p>

    <h2>Projects</h2>
    <p>Add your projects here.</p>

    <h2>Contact</h2>
    <p><a href="mailto:you@example.com">you@example.com</a></p>

    <h2>API check</h2>
    <p>Response from <code>/api/hello</code>: <span id="api-status">loading…</span></p>
  </main>

  <script>
    fetch("/api/hello")
      .then(function (r) { return r.json(); })
      .then(function (d) { document.getElementById("api-status").textContent = d.message; })
      .catch(function () { document.getElementById("api-status").textContent = "unavailable (run with vercel dev)"; });
  </script>
</body>
</html>
